conky.config = {
    alignment = 'bottom_left',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=13',
    gap_x = 40,
    gap_y = 550,
    minimum_height = 5,
    minimum_width = 320,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x11 = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    color1 = 'FF0000',
}

conky.text = [[
${color1}${font DejaVu Sans Mono:size=18}S Y S T E M   O S ${hr 2}${font}
${color}Uptime:${color1} $uptime
${color}RAM Usage:${color1} $mem / $memmax ($memperc%)
${color1}${membar 4}
${color}CPU Usage:${color1} $cpu%
${color1}${cpubar 4}

${color1}${font DejaVu Sans Mono:size=18}G P U   S T A T S ${hr 2}${font}
${color}GPU Usage:${color1} ${execi 2 cat /sys/class/drm/card1/device/gpu_busy_percent 2>/dev/null || echo "0"}%
${color}GPU Temp:${color1} ${execi 2 sensors 2>/dev/null | grep -i edge | head -n 1 | awk '{print $2}' | tr -d '+' || echo "N/A"}

${color1}${font DejaVu Sans Mono:size=18}T O P   P R O C E S S E S ${hr 2}${font}
${color1}${top name 1} ${alignr}${color}${top cpu 1}%
${color}${top name 2} ${alignr}${color}${top cpu 2}%
${color}${top name 3} ${alignr}${color}${top cpu 3}%

${color1}${font DejaVu Sans Mono:size=18}W E A T H E R ${hr 2}${font}
${color}Campinas: ${execi 1800 curl -s 'pt.wttr.in/Campinas?format=%t+-+%C'}

${color1}${font DejaVu Sans Mono:size=18}T I M E ${hr 2}${font}
${alignc}${color1}${font DejaVu Sans Mono:size=35}${time %H:%M}${font}
${alignc}${color}${time %A, %d %B}
]]