backend = "glx";
shadow = false;

# 1. Cantos Arredondados
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = \"dock\"",
  "window_type = \"desktop\""
];

# 2. Motor de Animações (Ajustado para ser mais suave)
animations = true;
animation-stiffness = 50.0;       # Diminuído (deixa o movimento mais lento e suave)
animation-damping = 18.0;         # Ajustado (evita que a janela fique quicando no final)
animation-window-mass = 0.8;      # Aumentado (dá mais peso para o deslize aparecer)
animation-clamping = true;

# Estilo das transições
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "slide-up";
animation-for-workspace-switch-in = "slide-left";
animation-for-workspace-switch-out = "slide-right";
animation-for-geometry-change = "slide"; 

# 3. Efeito de Esmaecimento (Fading)
fading = true;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 10;

# 4. Transparência Dinâmica
inactive-opacity = 0.85;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
  "class_g = \"Cairo-clock\"",
  "class_g = \"GLava\"",
  "class_g = \"glava\""
];

# Configurações do Blur (Proteção contra a linha)
blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
};

blur-background-exclude = [
  "window_type = \"desktop\"",
  "class_g = \"Plank\"",
  "class_g = \"glava\"",
  "class_g = \"Conky\""
];

wintypes:
{
  dock = { shadow = false; blur-background = false; corner-radius = 0; };
  desktop = { shadow = false; blur-background = false; corner-radius = 0; };
};
